    <!-- TITLE PROTECTION SCRIPT - PREVENTS BACKEND OVERRIDE -->
    <script>
      // Define correct titles for different interfaces
      const TITLES = {
        user: "Mama Tiffin - Fresh Home-Style Meals Delivered | Order Online Tiffin Service",
        admin: "Admin Panel - Mama Tiffin | Manage Orders & Deliveries"
      };
      
      // Detect interface type
      function getInterfaceType() {
        const hostname = window.location.hostname;
        const pathname = window.location.pathname;
        
        return (hostname.includes('admin') || pathname.startsWith('/admin')) ? 'admin' : 'user';
      }
      
      // Set correct title based on interface
      function setCorrectTitle() {
        const interfaceType = getInterfaceType();
        const correctTitle = TITLES[interfaceType];
        
        if (document.title !== correctTitle) {
          document.title = correctTitle;
          console.log(`🔧 Title corrected to: ${correctTitle}`);
        }
      }
      
      // Protect title from being overridden
      function protectTitle() {
        const titleElement = document.getElementById('page-title');
        const interfaceType = getInterfaceType();
        const correctTitle = TITLES[interfaceType];
        
        // Set initial title
        document.title = correctTitle;
        if (titleElement) titleElement.textContent = correctTitle;
        
        // Create observer to watch for title changes
        const observer = new MutationObserver(function(mutations) {
          mutations.forEach(function(mutation) {
            if (mutation.type === 'childList' && document.title !== correctTitle) {
              console.warn('⚠️ Title was overridden, restoring correct title');
              document.title = correctTitle;
            }
          });
        });
        
        // Start observing
        observer.observe(document, { childList: true, subtree: true });
        
        // Also check periodically (fallback)
        setInterval(function() {
          if (document.title !== correctTitle) {
            document.title = correctTitle;
          }
        }, 1000);
      }
      
      // Initialize protection when DOM is ready
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', protectTitle);
      } else {
        protectTitle();
      }
      
      // Also protect on window load
      window.addEventListener('load', setCorrectTitle);
    </script>
